<body><main class="shell"><header class="top"><div class="brand"><span class="brand-pup" aria-hidden="true">🐶</span><span>人生超规格</span></div><div class="save" id="saveStatus">本地存档 · 仅保存在此浏览器</div></header>
<section id="home" class="screen active"><div class="hero home-hero"><div class="home-pup" aria-label="小狗插画" role="img">🐶</div><div class="eyebrow">A LIFE BEYOND THE ODDS</div><h1>八十亿分之一<br><span>这一次，人生超规格</span></h1><p>一只小狗陪你打开人生盲盒。出生在优渥之家，然后慢慢活成自己的故事。</p><div class="home-paws" aria-hidden="true">🐾　♡　🐾</div></div><div class="grid home-grid"><article class="card mode home-mode"><div class="icon">🐾</div><h2>亲手配置人生</h2><p>选择家境、家庭氛围、成长城市与人生偏好。把这张好牌，配成你喜欢的样子。</p><button class="btn" onclick="startWizard()">开始选择　→</button></article><article class="card mode home-mode"><div class="icon">🎲</div><h2>随机投胎</h2><p>命运为你抽取一张身份卡。从富裕家庭起步，最高抽中首富级巨富；每次都有不同的家人、城市和故事。</p><button class="btn ghost" onclick="randomStart()">交给命运　→</button></article></div><div class="btnrow" style="justify-content:center;margin-top:17px" id="continueRow"></div><div class="home-note">🐶 淞淞在这里陪你，人生的每一步由你来选。</div></section>
<section id="wizard" class="screen"><div class="wizard"><button class="btn ghost small back" onclick="show('home')">← 返回</button><div class="stephead"><span id="stepLabel">配置人生 · 1 / 5</span><span>随时可以重新开始</span></div><div class="progress"><i id="progress" style="width:20%"></i></div><div class="card"><div class="eyebrow" id="stepKicker"></div><h2 id="stepTitle"></h2><p class="muted" id="stepDesc"></p><div class="options" id="options"></div><div class="btnrow" style="justify-content:space-between"><button class="btn ghost" id="prevStep" onclick="prevWizard()">上一步</button><button class="btn" id="nextStep" onclick="nextWizard()">继续　→</button></div></div></div></section>
<section id="identity" class="screen"><div id="identityCard"></div><div class="btnrow" style="justify-content:center;margin-top:18px"><button class="btn ghost" onclick="show('home')">返回首页</button><button class="btn ghost" id="reroll" onclick="randomStart()">🎲 再抽一次</button><button class="btn" onclick="beginGame()">开启人生　→</button></div></section>

const steps=[['家境档位','你出生在怎样的财富世界？',[['富裕家庭','生活宽裕，选择很多，失败后有家人接住。'],['豪门世家','家族企业、社交圈与代际传承都在你的成长背景里。'],['超级富豪','全球资产、家庭办公室与跨国生活都是日常。'],['首富级巨富','顶尖家族财富，名字本身就可能成为新闻。']], 'wealth'],['家庭氛围','家人如何陪你长大？',data.moods.map(x=>[x[0],x[1]]),'mood'],['成长城市','你的童年从哪里展开？',data.cities.map(x=>[x[0],x[1]]),'city'],['个人特质','你最鲜明的天赋是什么？',data.traits.map(x=>[x[0],x[1]]),'trait'],['人生偏好','哪种生活最让你心动？',data.dreams.map(x=>[x[0],x[1]]),'dream']];

function selectOption(k,v){answers[k]=v;renderStep()}function nextWizard(){let s=steps[wizardIndex];if(!answers[s[3]]){toast('先选一个最像你的答案吧');return}if(wizardIndex<steps.length-1){wizardIndex++;renderStep()}else{profile=profileFrom({wealth:data.wealth.find(x=>x[0]===answers.wealth),mood:data.moods.find(x=>x[0]===answers.mood),city:data.cities.find(x=>x[0]===answers.city),trait:data.traits.find(x=>x[0]===answers.trait),dream:data.dreams.find(x=>x[0]===answers.dream)});renderIdentity();show('identity')}}function prevWizard(){if(wizardIndex){wizardIndex--;renderStep()}else show('home')}

function yearBand(age){return age<12?'child':age<18?'teen':age<25?'young':age<65?'adult':'elder'}
function beginGame(){state={age:0,stats:{底气:92,能力:24,关系:42,自由:48,影响力:18,压力:18},history:[],logs:[],pending:null,done:false,profile};show('game');buildLifeUI();logLife('出生','你出生在'+profile.wealth+'。'+profile.wealthStory+profile.family,'special');logLife('人生起点',`成长城市：${profile.city}。${profile.cityStory} 家庭氛围：${profile.mood}。${profile.moodStory}`,'');logLife('你的个性',`你最鲜明的特质是${profile.trait}：${profile.traitStory} 你心里最看重的是${profile.dream}。`,'');renderMeters();save();startClock()}
function buildLifeUI(){qs('#game').innerHTML=`<div class="live-layout"><aside class="life-side"><div class="card" style="padding:20px"><div class="eyebrow">你的漫长人生</div><div class="pet-banner"><div class="puppy-face" aria-label="可爱小狗装饰">🐶</div><div class="puppy-copy"><b>淞淞陪伴</b><br>陪你看着人生一点点展开。<br><span class="puppy-foot">♡ 汪呜，今天也要开心</span></div></div><div class="life-age"><span id="ageValue">0</span><small> 岁　·　<span id="calendarYear">2027</span> 年</small></div><div class="status-pill" id="lifeStatus">🌱 人生正在展开</div><div id="meters"></div><div class="life-tools"><button class="btn ghost" id="pauseButton" onclick="toggleClock()">⏸ 暂停</button><button class="btn ghost" onclick="changeSpeed()">⏩ <span id="speedLabel">正常速度</span></button></div><div class="muted" style="font-size:12px;margin-top:13px" id="miniIdentity"></div></div></aside><section class="card life-log-card"><div class="log-head"><div><div class="eyebrow">LIFE IN MOTION</div><h2 style="margin:7px 0">人生动态 <span class="puppy-foot">🐾</span></h2></div><div class="ticker" id="ticker">每秒约一年</div></div><div class="muted" style="margin-bottom:10px">时间自动流逝，重要时刻会停下来等你选择。</div><div class="log-list" id="logList" aria-live="polite"></div><div id="choiceMount"></div></section></div>`}
function logLife(label,copy,kind=''){if(!state)return;let entry={age:state.age,label,copy,kind};state.logs=state.logs||[];state.logs.push(entry);let list=qs('#logList');if(!list)return;renderLogEntry(entry,true)}
function renderLogEntry(entry,prepend=false){let list=qs('#logList');if(!list)return;let item=document.createElement('article');item.className='log-entry '+(entry.kind||'');item.innerHTML=`<div class="log-year">${entry.age} 岁 · ${esc(entry.label)}</div><div class="log-copy">${esc(entry.copy)}</div>`;if(prepend)list.prepend(item);else list.append(item);while(list.children.length>100)list.lastChild.remove()}
function renderMeters(){if(!state)return;const names=['底气','能力','关系','自由','影响力','压力'];let target=qs('#meters');if(!target)return;target.innerHTML=names.map(k=>`<div class="meter"><div class="meterline"><span>${k}</span><span>${state.stats[k]}</span></div><div class="bar"><i style="width:${Math.max(3,Math.min(100,state.stats[k]))}%"></i></div></div>`).join('');let mini=qs('#miniIdentity');if(mini)mini.textContent=`${profile.wealth} · ${profile.city} · ${profile.dream}`;let age=qs('#ageValue');if(age)age.textContent=state.age;let year=qs('#yearValue');if(year)year.textContent=state.age;}
function startClock(){clearInterval(lifeTimer);lifePaused=false;updateClockUI();lifeTimer=setInterval(tickLife,lifeSpeed)}function stopClock(){clearInterval(lifeTimer);lifeTimer=null}function toggleClock(){if(lifePaused){startClock()}else{lifePaused=true;stopClock();updateClockUI()}}function changeSpeed(){lifeSpeed=lifeSpeed===1100?650:lifeSpeed===650?1800:1100;let labels={1100:'正常速度',650:'快进',1800:'慢速'};let l=qs('#speedLabel');if(l)l.textContent=labels[lifeSpeed];if(!lifePaused)startClock();let t=qs('#ticker');if(t)t.textContent=lifeSpeed===650?'快速流逝':lifeSpeed===1800?'缓慢流逝':'每秒约一年'}function updateClockUI(){let b=qs('#pauseButton'),s=qs('#lifeStatus');if(b)b.textContent=lifePaused?'▶ 继续':'⏸ 暂停';if(s)s.innerHTML=lifePaused?'⏸ 人生暂停中':'🌱 人生正在展开'}
function tickLife(){if(!state||state.done||state.pending)return;state.age++;renderMeters();if(milestones[state.age]){lifePaused=true;stopClock();updateClockUI();showMilestone(milestones[state.age]);save();return}if(state.age%Math.max(1,Math.round(5+Math.random()*4))===0){let text=pick(annualMoments[yearBand(state.age)]);logLife('生活片段',text)}if(state.age===1)logLife('一岁','你第一次摇摇晃晃地迈出几步，家里所有人都为你鼓掌。','special');if(state.age===3)logLife('三岁','你开始用自己的方式认识世界，问题一个接一个，家人总也答不完。');if(state.age===10)logLife('十岁','你已经有了最喜欢的书、最喜欢的朋友，还有一点点自己的小主意。');if(state.age===16)logLife('十六岁','你开始拥有独立的想法，也在练习如何让别人听见它们。');if(state.age===21)logLife('二十一岁',`你已经走过几段自己的路。${profile.dreamStory}`,'special');if(state.age===30)logLife('三十岁','你逐渐明白，真正适合自己的生活不一定和别人的标准相同。','special');if(state.age===40)logLife('四十岁','你拥有更多决定权，也开始认真思考什么值得投入时间。','special');if(state.age===60)logLife('六十岁','回望过去，许多重要时刻并不宏大，只是当时有人陪在身边。','special');if(state.age===80){finishLife();return}save()}
function showMilestone(m,reopened=false){state.pending=true;let mount=qs('#choiceMount');mount.innerHTML=`<div class="choice-overlay"><div class="eyebrow">✦ 关键人生抉择 · ${state.age} 岁</div><h3>${esc(m.title)}</h3><p>${esc(m.story)}</p><div class="choices">${m.opts.map((c,i)=>`<button class="choice" onclick="resolveMilestone(${i})"><b>${esc(c[0])}</b><small>${esc(c[1])}</small></button>`).join('')}</div></div>`;if(!reopened)logLife('重要时刻',m.title,'important');let status=qs('#lifeStatus');if(status)status.innerHTML='💭 等你做出选择'}
function resolveMilestone(i){let m=milestones[state.age],c=m.opts[i];state.pending=null;c[1].split(' · ').forEach(part=>{let match=part.match(/^(.+?)\s*([+-]\d+)$/);if(match&&state.stats[match[1]]!==undefined)state.stats[match[1]]=Math.max(0,Math.min(100,state.stats[match[1]]+Number(match[2])))});state.history.push({age:state.age,event:m.title,choice:c[0],result:c[2]});qs('#choiceMount').innerHTML='';logLife('你的选择',`${c[0]}。${c[2]}（${c[1]}）`,'special');renderMeters();save();if(state.age>=80){finishLife();return}startClock()}
function finishLife(){stopClock();state.done=true;lifePaused=true;updateClockUI();let best=Object.entries(state.stats).filter(([k])=>k!=='压力'&&k!=='底气').sort((a,b)=>b[1]-a[1])[0][0],ending=best==='关系'?data.endings[2]:best==='影响力'?data.endings[1]:best==='自由'?data.endings[0]:data.endings[3];qs('#endingBox').innerHTML=`<div class="eyebrow">一生故事 · 0—80 岁</div><div style="font-size:56px;margin:18px">🐾</div><h2>${esc(ending[0])}</h2><div class="score">${state.stats[best]}<small style="font:14px sans-serif;color:#9a8277"> / ${best}</small></div><p class="ending-copy">${esc(ending[1])}</p><p class="muted">你在 ${profile.wealth} 的家庭中长大，经历了 ${state.history.length} 次重要选择。你的人生偏好是${profile.dream}，而最终最闪亮的部分是${best}。</p><div class="details" style="max-width:650px;margin:25px auto">${Object.entries(state.stats).map(([k,v])=>`<div class="detail"><small>${esc(k)}</small><strong>${v} / 100</strong></div>`).join('')}</div><div class="btnrow" style="justify-content:center;margin-top:22px"><button class="btn" onclick="newLife()">再过一次人生　↻</button><button class="btn ghost" onclick="downloadSave()">导出人生记录</button></div>`;localStorage.removeItem('lifeGameSave');updateContinue();show('ending')}
function save(){if(!state)return;try{localStorage.setItem('lifeGameSave',JSON.stringify({profile,state,lifeSpeed,lifePaused}));let status=qs('#saveStatus');if(status)status.textContent='已自动保存 · '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});updateContinue()}catch(e){}}
function resume(){if(loadSave()){lifeSpeed=JSON.parse(localStorage.getItem('lifeGameSave')).lifeSpeed||1100;show('game');buildLifeUI();(state.logs||[]).slice(-100).reverse().forEach(entry=>renderLogEntry(entry));renderMeters();if(state.pending){lifePaused=true;showMilestone(milestones[state.age],true);updateClockUI()}else startClock()}}
function newLife(){stopClock();localStorage.removeItem('lifeGameSave');state=null;profile=null;updateContinue();show('home')}
